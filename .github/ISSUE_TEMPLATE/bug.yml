name: Bug report
description: Something does not work
labels: [bug]
body:
  - type: dropdown
    id: site
    attributes: { label: Site, options: [x.com, discord.com, Other] }
    validations: { required: true }
  - type: input
    id: where
    attributes: { label: Where on the site, placeholder: "timeline, reply, DM, channel…" }
  - type: input
    id: env
    attributes: { label: Browser, userscript manager and script version }
    validations: { required: true }
  - type: textarea
    id: steps
    attributes: { label: What happened and what you expected }
    validations: { required: true }
  - type: markdown
    attributes: { value: "Please do not paste file names or private content." }
