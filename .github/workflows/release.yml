name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Checksum
        run: cd dist && sha256sum stash-roulette.user.js > stash-roulette.user.js.sha256
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/stash-roulette.user.js
            dist/stash-roulette.user.js.sha256
          generate_release_notes: true
